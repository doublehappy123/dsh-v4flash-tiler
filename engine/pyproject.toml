[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v4flash-image-tiler"
version = "0.1.0"
description = "Plugin that tiles oversized images before sending them to DeepSeek v4Flash vision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.scripts]
v4flash-tiler = "v4flash_tiler.__main__:main"

[tool.setuptools.packages.find]
include = ["v4flash_tiler*"]
