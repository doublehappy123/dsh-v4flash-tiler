name: DSH upstream watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream docs/interfaces
        run: node .github/upstream-check.mjs

      - name: Open issue and update baseline
        if: hashFiles('.github/UPSTREAM_CHANGES.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "🔔 DSH 上游更新提醒（$(date +%F)）" --body-file .github/UPSTREAM_CHANGES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-baseline.json
          git commit -m "chore: update upstream baseline"
          git push
